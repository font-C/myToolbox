[package]
name = "toolbox"
version = "0.1.0"
description = "本地工具箱（含 PDF 裁剪）"
authors = ["you"]
edition = "2021"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-pdf-kit = "=0.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
