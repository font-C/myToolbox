[package]
name = "toolbox"
version = "0.4.4"
description = "本地工具箱（插件化外壳 + 插件商店）"
authors = ["you"]
edition = "2021"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 主程序自动更新（specs/07）：更新目录 app-update.json 静态托管，安装包 minisign 验签
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插件内核：.tbox 解包、校验、验签
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
ed25519-dalek = "2"
# PDF 处理内核（broker）：压缩（图像重编码）、加密/解锁（标准安全处理器 AES-256）
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
flate2 = "1"
rand = "0.8"
# 系统剪贴板（broker）：剪贴板历史插件的读写通道
arboard = "3"
# 商店拉取（Rust 端 HTTP）：绕开 webview CORS，任何 https 目录都能当商店源
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-pdf-kit = "=0.3.2"

# Windows：用 pdfium 把裁剪后的 PDF 逐页渲染成位图，再用 GDI 打印到默认打印机
[target.'cfg(target_os = "windows")'.dependencies]
pdfium-render = { version = "=0.8.37" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
