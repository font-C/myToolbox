name: Build & Release

# —— 触发条件（发版是显式动作：打 tag 或手动运行，普通提交不打包）——
# 1) push vX.Y.Z tag    → 创建/更新**版本化 Release** (tag=vX.Y.Z)
# 2) workflow_dispatch  → 手动确认后发布（mode=auto/version/latest）
# 注：插件变更走 store.yml 自动重发商店，与安装包发布解耦。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 发布模式
        required: false
        default: auto
        type: choice
        options:
          - auto
          - version
          - latest

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
      version: ${{ steps.kind.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: kind
        run: |
          V="$(node -p "require('./package.json').version")"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

          MODE="${{ inputs.mode }}"
          if [[ -z "$MODE" || "$MODE" == "auto" ]]; then
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
              echo "kind=version" >> "$GITHUB_OUTPUT"
            elif git ls-remote --tags origin "refs/tags/v${V}" | grep -q "\srefs/tags/v${V}"; then
              echo "kind=version" >> "$GITHUB_OUTPUT"
            else
              echo "kind=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "kind=${MODE}" >> "$GITHUB_OUTPUT"
          fi

  # —— 构建（只产 macOS dmg + Windows exe 安装包）——
  build:
    needs: decide
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
          - os: windows-latest
            bundles: nsis
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: (Linux) Install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            src-tauri/target
          key: ${{ matrix.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-tauri-

      - name: (Windows) Download pdfium.dll
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 用 releases/latest/download 直链，不走 api.github.com（匿名配额限流会让构建随机失败）
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz"
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz
          tar -xzf pdfium.tgz
          New-Item -ItemType Directory -Force -Path src-tauri | Out-Null
          Copy-Item bin/pdfium.dll src-tauri/pdfium.dll
          Get-Item src-tauri/pdfium.dll | Select-Object Name,Length

      # 主程序自动更新（specs/07）：createUpdaterArtifacts 已开启，构建即需签名私钥。
      # 构建签名只认 TAURI_SIGNING_PRIVATE_KEY（密钥内容，单行 base64）；
      # 空密码密钥也要显式置空密码变量，否则 CLI 会尝试交互式提示（CI 无 tty 直接失败）。
      - name: Resolve updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "✗ 缺少 secret TAURI_SIGNING_PRIVATE_KEY"
            echo "  生成：npm run tauri signer generate -- -w .secrets/updater-signing.key"
            echo "  配置见 specs/07-app-update.md「一次性配置」"
            exit 1
          fi
          # 剥离空白：secret 粘贴若带换行会破坏 GITHUB_ENV 的行格式
          KEY_B64="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Build & bundle
        shell: bash
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
        run: |
          cd src-tauri
          # 缓存恢复的 target 里残留历史版本的 bundle 产物（bundle/dmg|nsis|macos 及 dist/），
          # bundler 只覆盖同名文件、收集步骤又是按 glob 拷贝——不清理会把旧版本安装包
          # 一并带进发布资产（v0.4.3 污染事故）。打包前整目录清掉。Windows 默认 shell 是
          # PowerShell，rm -rf 非法，必须显式 shell: bash。
          rm -rf target/release/bundle
          npm run tauri build

      - name: Collect & upload artifacts
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd src-tauri/target/release/bundle
          # 只收集当次构建：dist 目录从零开始（兜底，正常情况上一步已清）
          rm -rf dist
          mkdir -p dist
          # macOS: 仅 dmg 安装包
          [ -d dmg ]  && cp -r dmg/*.dmg dist/ 2>/dev/null || true
          # Windows: 仅 nsis 安装包
          [ -d nsis ] && cp -r nsis/*.exe dist/ 2>/dev/null || true
          # 自动更新产物（specs/07）：macOS 更新载体 .app.tar.gz 与两平台 .sig 签名
          # macOS bundler 产物名不含架构（MyToolbox.app.tar.gz），补「版本+架构」后缀
          # 供更新目录映射平台键；仅改文件名不改字节，minisign 签名仍然有效
          if compgen -G "macos/*.app.tar.gz" > /dev/null; then
            ARCH="$(uname -m | sed 's/arm64/aarch64/')"
            for F in macos/*.app.tar.gz; do
              BASE="$(basename "$F" .app.tar.gz)"
              cp "$F" "dist/${BASE}_${VERSION}_${ARCH}.app.tar.gz"
              cp "${F}.sig" "dist/${BASE}_${VERSION}_${ARCH}.app.tar.gz.sig"
            done
          fi
          [ -d nsis ] && cp nsis/*.exe.sig dist/ 2>/dev/null || true
          ls -lh dist/
        id: collect
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}-${{ matrix.rust_targets }}
          path: src-tauri/target/release/bundle/dist/
          if-no-files-found: error

  # —— 发布 ——
  # 即使某平台构建失败也尝试发布 (只上传成功构建的 artifacts)
  release:
    needs: [decide, build]
    if: always() && needs.decide.result == 'success'
    outputs:
      tag: ${{ steps.verrel.outputs.tag }}
      body: ${{ steps.verrel.outputs.body }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      API: https://api.github.com/repos/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist/
      - name: Skip if no artifacts
        if: hashFiles('dist/*') == ''
        run: echo "⚠️  没有可发布的产物，跳过"; exit 0

      # ---- 模式 1：版本化 Release (vX.Y.Z) ----
      - name: Release (version tag)
        id: verrel
        if: needs.decide.outputs.kind == 'version'
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          TAG="${GITHUB_REF_NAME:-v${VERSION}}"
          [[ "$TAG" != v* ]] && TAG="v${VERSION}"

          echo "🚀 创建/更新 version Release ${TAG}"

          # 1) tag 指向当前 HEAD；已一致则不动——删除/重建 tag 会把已发布的 Release 打回草稿
          if [ "$(git rev-parse "refs/tags/${TAG}"^{commit} 2>/dev/null || true)" != "${GITHUB_SHA}" ]; then
            git push origin ":refs/tags/${TAG}" || true
            git tag -f "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}" --force
          fi

          # 2) 更新说明：上一版本 tag → 本 tag 的提交列表（简要描述）
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "${TAG}" | head -1 || true)
          CHANGELOG=""
          if [ -n "${PREV_TAG:-}" ]; then
            CHANGELOG=$(git log --no-merges --format='- %s (%h)' "${PREV_TAG}..${TAG}" | head -30)
          fi
          BODY="## 更新内容（${PREV_TAG:-} → ${TAG}）
          ${CHANGELOG:-详见提交历史}
          ---
          下载：Windows（exe 安装包）· macOS（dmg）· Linux（deb / AppImage）。全程本地处理，不上传数据。
          插件商店：主源 GitHub Pages，镜像 Gitee raw（应用内商店页一键切换）。"
          echo "${BODY}"

          # 3) 查/建 Release（用 gh：手搓 curl 直传上传端点会立即 4xx（302 后本体丢失），
          #    旧脚本无 -f 静默跳过导致 Release 缺资产甚至未创建（v0.4.3 事故），不再手写）
          printf '%s\n' "${BODY}" > /tmp/release-body.txt
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "复用 ${TAG} Release"
            gh release edit "${TAG}" --repo "${REPO}" --title "工具箱 ${TAG}" --notes-file /tmp/release-body.txt
          else
            gh release create "${TAG}" --repo "${REPO}" --title "工具箱 ${TAG}" --notes-file /tmp/release-body.txt
          fi

          # 4) 清旧 assets：--clobber 只覆盖同名，历史残留资产必须显式清掉，
          #    保证资产集 = 当次构建（不混入旧版本安装包）
          for A in $(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets[].id' 2>/dev/null || true); do
            gh api -X DELETE "repos/${REPO}/releases/assets/${A}" >/dev/null
          done

          # 5) 生成主程序更新目录（specs/07）：tauri updater 端点文件，
          #    store.yml 会从最新稳定版 Release 取它并随商店发布到 Pages / Gitee 镜像
          node scripts/gen-update-catalog.mjs \
            --version "${VERSION}" \
            --base-url "https://github.com/${REPO}/releases/download/${TAG}/" \
            --notes-file /tmp/release-body.txt \
            --dist dist --out dist/app-update.json

          # 6) 上传全部产物（含 app-update.json；--clobber 同名覆盖）
          for F in dist/*; do echo "⬆️  $(basename "$F")"; done
          gh release upload "${TAG}" --repo "${REPO}" --clobber dist/*
          echo "✅ https://github.com/${REPO}/releases/tag/${TAG}"

          # 7) 传给 gitee-release job
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "${BODY}"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # ---- 模式 2：latest Release (tag=latest，覆盖更新) ----
      - name: Release (latest)
        if: needs.decide.outputs.kind == 'latest'
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          TAG="latest"

          echo "🎯 更新 latest Release (当前 v${VERSION})"

          # 1) latest tag → 指向当前 HEAD
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG}" || true
          fi
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}" --force

          # 2) 查/建 latest Release（gh，理由同 version 模式）
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "复用 latest Release"
            gh release edit "${TAG}" --repo "${REPO}" \
              --title "latest (v${VERSION})" \
              --notes "自动滚动更新。当前版本 **v${VERSION}**。"
          else
            gh release create "${TAG}" --repo "${REPO}" --prerelease \
              --title "latest (滚动构建)" \
              --notes "自动滚动更新。当前版本 **v${VERSION}**。

          ⚠️ 此 tag 每次 push main 都会覆盖更新，只保留最新构建。需要稳定下载请使用带版本号的 Release (vX.Y.Z)。"
          fi

          # 3) 清旧 assets → 这就是"原来 releases 里面的改为对应版本"（latest 覆盖更新，版本化 Release 不受影响）
          for A in $(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets[].id' 2>/dev/null || true); do
            gh api -X DELETE "repos/${REPO}/releases/assets/${A}" >/dev/null
          done

          # 4) 上传
          for F in dist/*; do echo "⬆️  $(basename "$F")"; done
          gh release upload "${TAG}" --repo "${REPO}" --clobber dist/*
          echo "✅ https://github.com/${REPO}/releases/tag/${TAG}"

  # —— 同步版本化 Release 到 Gitee（代码镜像仓库的 Gitee Release 附安装包）——
  gitee-release:
    needs: [decide, release]
    if: >-
      always() &&
      needs.decide.outputs.kind == 'version' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPO: ${{ secrets.GITEE_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sync release to Gitee
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ] || [ -z "${GITEE_REPO:-}" ]; then
            echo "跳过：未配置 GITEE_TOKEN / GITEE_REPO secrets"
            exit 0
          fi
          VERSION="${{ needs.decide.outputs.version }}"
          TAG="v${VERSION}"
          OWNER="${GITEE_REPO%%/*}"
          GREPO="${OWNER}/my-toolbox"   # 安装包发布在代码镜像仓库的 Gitee Release
          GAPI="https://gitee.com/api/v5/repos/${GREPO}"

          # 更新说明：上一版本 tag → 本 tag（与 GitHub Release 一致）
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "${TAG}" | head -1 || true)
          CHANGELOG=""
          if [ -n "${PREV_TAG:-}" ]; then
            CHANGELOG=$(git log --no-merges --format='- %s (%h)' "${PREV_TAG}..${TAG}" | head -30)
          fi
          BODY="## 更新内容（${PREV_TAG:-} → ${TAG}）
          ${CHANGELOG:-详见提交历史}
          ---
          下载：Windows（exe 安装包）· macOS（dmg）· Linux（deb / AppImage）。全程本地处理，不上传数据。"

          # tag 同步到 Gitee（Gitee Release 依附于 tag）
          git push "https://${OWNER}:${GITEE_TOKEN}@gitee.com/${GREPO}.git" "refs/tags/${TAG}" --force 2>/dev/null || true

          # 已有同名 Release → 删除重建（附件随之重传）
          OLD_ID=$(curl -s -H "Authorization: Bearer ${GITEE_TOKEN}" "${GAPI}/releases/tags/${TAG}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const v=JSON.parse(s).id;if(v!=null)console.log(v)}catch(e){}})")
          if [ -n "${OLD_ID:-}" ]; then
            echo "删除旧 Gitee Release id=${OLD_ID}"
            curl -s -X DELETE -H "Authorization: Bearer ${GITEE_TOKEN}" "${GAPI}/releases/${OLD_ID}" >/dev/null || true
            sleep 2
          fi

          # 创建 Release（Gitee 要求 target_commitish）
          jq -n --arg tag "${TAG}" --arg body "${BODY}" \
            '{tag_name:$tag, name:("工具箱 "+$tag), body:$body, target_commitish:"master", prerelease:false}' > /tmp/gitee-payload.json
          REL_ID=$(curl -sf -X POST -H "Authorization: Bearer ${GITEE_TOKEN}" \
            -H "Content-Type: application/json" -d @/tmp/gitee-payload.json \
            "${GAPI}/releases" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const v=JSON.parse(s).id;if(v!=null)console.log(v)}catch(e){}})")
          [ -n "${REL_ID:-}" ] || { echo "❌ Gitee Release 创建失败"; exit 1; }
          echo "Gitee Release id=${REL_ID}"

          # 只同步安装包与自动更新载体（dmg/exe/app.tar.gz）；.sig 不需要（签名在更新目录 JSON 里）
          # 上传 curl 带 -f：附件上传失败必须让任务响亮失败，不得静默缺件
          for F in dist/*.dmg dist/*.exe dist/*.app.tar.gz; do
            [ -e "$F" ] || continue
            echo "⬆️  $(basename "$F")"
            curl -sf -X POST -H "Authorization: Bearer ${GITEE_TOKEN}" \
              -F "file=@${F}" "${GAPI}/releases/${REL_ID}/attach_files" >/dev/null
          done
          echo "✅ https://gitee.com/${GREPO}/releases/tag/${TAG}"

  # —— 发布成功后同步商店（app-update.json 更新目录随商店发布到 Pages / Gitee）——
  # store.yml 负责从最新稳定版 Release 取更新目录并入 store/，
  # 触发放流水线末尾：等 GitHub Release 与 Gitee Release 的安装包都就位后再同步。
  trigger-store-sync:
    needs: [decide, release, gitee-release]
    if: >-
      always() &&
      needs.decide.outputs.kind == 'version' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger store.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run store.yml --repo "${{ github.repository }}" --ref master
          echo "✓ 已触发 store.yml：更新目录将发布到 Pages 主源与 Gitee 镜像"
