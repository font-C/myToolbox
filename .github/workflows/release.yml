name: Build & Release

# —— 触发条件 ——
# 1) push vX.Y.Z tag    → 创建/更新**版本化 Release** (tag=vX.Y.Z)
# 2) push main/master   → 更新 "latest" Release (tag=latest，覆盖 assets)
# 3) 手动 workflow_dispatch
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: 发布模式
        required: false
        default: auto
        type: choice
        options:
          - auto
          - version
          - latest

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
      version: ${{ steps.kind.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: kind
        run: |
          V="$(node -p "require('./package.json').version")"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

          MODE="${{ inputs.mode }}"
          if [[ -z "$MODE" || "$MODE" == "auto" ]]; then
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
              echo "kind=version" >> "$GITHUB_OUTPUT"
            elif git ls-remote --tags origin "refs/tags/v${V}" | grep -q "\srefs/tags/v${V}"; then
              # 若当前版本已有 vX.Y.Z tag → version
              echo "kind=version" >> "$GITHUB_OUTPUT"
            else
              echo "kind=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "kind=${MODE}" >> "$GITHUB_OUTPUT"
          fi

  # —— 构建（参考已验证的 build-tauri.yml 矩阵）——
  build:
    needs: decide
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: arm64 + x64 同时编 (两个 target 同 runner)
          - os: macos-latest
            bundles: app,dmg
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
          # Windows: nsis 即可
          - os: windows-latest
            bundles: nsis
            rust_targets: x86_64-pc-windows-msvc
          # Linux: deb + AppImage
          - os: ubuntu-latest
            bundles: deb,appimage
            rust_targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: (Linux) Install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            src-tauri/target
          key: ${{ matrix.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-tauri-

      - name: (Windows) Download pdfium.dll
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(curl -s https://api.github.com/repos/bblanchon/pdfium-binaries/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | sed 's/.*"\(.*\)"/\1/')
          echo "pdfium version: ${VERSION}"
          curl -sL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/${VERSION}/pdfium-win-x64.tgz"
          tar -xzf pdfium.tgz
          cp bin/pdfium.dll src-tauri/pdfium.dll
          ls -la src-tauri/pdfium.dll

      - name: Build & bundle
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
        run: |
          cd src-tauri
          npm run tauri build

      - name: Collect & upload artifacts
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          mkdir -p dist
          # macOS: dmg 目录 + macos 目录(.app)
          [ -d dmg ]  && cp -r dmg/*.dmg dist/ 2>/dev/null || true
          [ -d macos ] && for d in macos/*.app; do
              tar -czf "dist/$(basename "${d}").tar.gz" -C macos "$(basename "${d}")" 2>/dev/null || true
            done
          # Windows: nsis (.exe) + msi (.msi)
          [ -d nsis ] && cp -r nsis/*.exe dist/ 2>/dev/null || true
          [ -d msi ]  && cp -r msi/*.msi dist/ 2>/dev/null || true
          # Linux: deb + appimage + rpm
          [ -d deb ]  && cp -r deb/*.deb dist/ 2>/dev/null || true
          [ -d appimage ] && cp -r appimage/*.AppImage dist/ 2>/dev/null || true
          [ -d rpm ]  && cp -r rpm/*.rpm dist/ 2>/dev/null || true
          ls -lh dist/
        id: collect
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}-${{ matrix.rust_targets }}
          path: src-tauri/target/release/bundle/dist/
          if-no-files-found: error

  # —— 发布 ——
  release:
    needs: [decide, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      API: https://api.github.com/repos/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist/

      # ---- 模式 1：版本化 Release (vX.Y.Z) ----
      - name: Release (version tag)
        if: needs.decide.outputs.kind == 'version'
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          TAG="${GITHUB_REF_NAME:-v${VERSION}}"
          [[ "$TAG" != v* ]] && TAG="v${VERSION}"

          echo "🚀 创建/更新 version Release ${TAG}"

          # 1) tag 必须指向当前 HEAD
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG}" || true
          fi
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}" --force

          # 2) 查/建 Release
          REL_JSON=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" "${API}/releases/tags/${TAG}" || true)
          REL_ID=$(echo "$REL_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).id)}catch(e){}})")

          if [[ -z "${REL_ID:-}" ]]; then
            REL_JSON=$(curl -sL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "{
                \"tag_name\":\"${TAG}\",
                \"name\":\"工具箱 ${TAG}\",
                \"body\":\"版本 **${TAG}**。产物含 macOS dmg、Windows nsis、Linux deb+AppImage。\",
                \"draft\":false,\"prerelease\":false
              }" "${API}/releases")
            REL_ID=$(echo "$REL_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).id))")
            echo "创建 ${TAG} Release id=${REL_ID}"
          else
            echo "复用 ${TAG} Release id=${REL_ID}"
          fi

          # 3) 清旧 assets
          for A in $(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" "${API}/releases/${REL_ID}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).assets.forEach(a=>console.log(a.id)))"); do
            curl -sL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" "${API}/releases/assets/${A}" >/dev/null
          done

          # 4) 上传
          for F in dist/*; do
            echo "⬆️  $(basename "$F")"
            curl -sL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${F}" \
              "${API}/releases/${REL_ID}/assets?name=$(basename "${F}")" >/dev/null
          done
          echo "✅ https://github.com/${REPO}/releases/tag/${TAG}"

      # ---- 模式 2：latest Release (tag=latest，覆盖更新) ----
      - name: Release (latest)
        if: needs.decide.outputs.kind == 'latest'
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          TAG="latest"

          echo "🎯 更新 latest Release (当前 v${VERSION})"

          # 1) latest tag → 指向当前 HEAD
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG}" || true
          fi
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}" --force

          # 2) 查/建 latest Release
          REL_JSON=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" "${API}/releases/tags/${TAG}" || true)
          REL_ID=$(echo "$REL_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).id)}catch(e){}})")

          if [[ -z "${REL_ID:-}" ]]; then
            REL_JSON=$(curl -sL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "{
                \"tag_name\":\"${TAG}\",
                \"name\":\"latest (滚动构建)\",
                \"body\":\"自动滚动更新。当前版本 **v${VERSION}**。\n\n⚠️ 此 tag 每次 push main 都会覆盖更新，只保留最新构建。需要稳定下载请使用带版本号的 Release (vX.Y.Z)。\",
                \"draft\":false,\"prerelease\":true
              }" "${API}/releases")
            REL_ID=$(echo "$REL_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).id))")
            echo "创建 latest Release id=${REL_ID}"
          else
            echo "复用 latest Release id=${REL_ID}"
            # 更新 body 反映当前版本
            curl -sL -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"name\":\"latest (v${VERSION})\",\"body\":\"自动滚动更新。当前版本 **v${VERSION}**。\"}" \
              "${API}/releases/${REL_ID}" >/dev/null
          fi

          # 3) 清旧 assets → 这就是"原来 releases 里面的改为对应版本"（latest 覆盖更新，版本化 Release 不受影响）
          for A in $(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" "${API}/releases/${REL_ID}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).assets.forEach(a=>console.log(a.id)))"); do
            curl -sL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" "${API}/releases/assets/${A}" >/dev/null
          done

          # 4) 上传
          for F in dist/*; do
            echo "⬆️  $(basename "$F")"
            curl -sL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${F}" \
              "${API}/releases/${REL_ID}/assets?name=$(basename "${F}")" >/dev/null
          done
          echo "✅ https://github.com/${REPO}/releases/tag/${TAG}"
