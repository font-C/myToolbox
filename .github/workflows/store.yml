name: Build & Publish Plugin Store

# 商店发布：构建全部插件 → 签名 → 生成 store/ 站点（index.json + 插件包）
# → 发布到 GitHub Pages（主源）与 Gitee（镜像源）。
# 契约见 specs/06-store-publish.md

# 触发：master 分支推送且涉及插件/商店文件，或手动。
# 不用 tag 触发：github-pages 环境默认部署保护只放行默认分支，
# tag ref 的运行会在 deploy-pages 阶段被拒（Environment protection rules）。
# 商店语义 = 跟随 master 最新构建，与发版 tag 内容天然一致（tag 总是打在 master 头上）。
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'plugins/**'
      - 'packages/plugin-sdk/**'
      - 'scripts/build-store.mjs'
      - 'scripts/build-plugin.mjs'
      - 'scripts/fetch-store-baseline.mjs'
      - '.github/workflows/store.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect changed plugins
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          IDS=""
          # 仅在能取到推送前后两个提交时做增量判定；删除插件目录时回退全量
          if [[ "${{ github.event_name }}" == "push" && "$BEFORE" =~ ^[0-9a-f]{40}$ ]] \
             && git cat-file -e "$BEFORE" 2>/dev/null; then
            DELETED=$(git diff --name-status "$BEFORE" "$AFTER" -- plugins/ | grep -c '^D' || true)
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- plugins/ \
              | grep -E '^plugins/[^/]+/' | cut -d/ -f2 | sort -u || true)
            if [[ "${DELETED:-0}" == "0" && -n "$CHANGED" ]]; then
              IDS=$(echo "$CHANGED" | tr '\n' ',' | sed 's/,$//')
            fi
          fi
          echo "ids=${IDS}" >> "$GITHUB_OUTPUT"
          echo "变更插件: ${IDS:-无（全量构建）}"

      - name: Build plugins (.tbox)
        run: |
          IDS="${{ steps.detect.outputs.ids }}"
          if [ -z "$IDS" ]; then
            npm run build:plugins
            exit 0
          fi
          # 增量：回填未变更插件基线（从现有商店下载），只构建变更插件；基线不可用则回退全量
          if node scripts/fetch-store-baseline.mjs "https://font-c.github.io/myToolbox/store/" "$IDS"; then
            npm run build:plugins -- --only="$IDS"
          else
            echo "↩️ 基线回填失败，回退全量构建"
            npm run build:plugins
          fi

      - name: Build store index (signed)
        env:
          # Ed25519 私钥 hex；公钥固定在应用内（src-tauri/src/plugin_installer.rs）
          TOOLBOX_SIGNING_SK: ${{ secrets.ED25519_SIGNING_SK }}
        run: node scripts/build-store.mjs

      # 主程序更新目录（specs/07）：release.yml 发版时把 app-update.json 传成 Release 资产，
      # 这里取「最新一个带该资产的稳定版 Release」的目录放入 store/，与插件索引一同发布。
      # 找不到（如发版功能上线前）则跳过，保留现状。
      - name: Include app update catalog (app-update.json)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          REL_ID=$(gh api "repos/${REPO}/releases?per_page=30" \
            --jq '[.[] | select(.draft == false and .prerelease == false)] | map(select(any(.assets[]; .name == "app-update.json"))) | first | .id // empty')
          if [ -z "${REL_ID}" ]; then
            echo "ℹ 暂无带 app-update.json 的稳定版 Release，跳过（发版后自动出现）"
            exit 0
          fi
          ASSET_URL=$(gh api "repos/${REPO}/releases/${REL_ID}" \
            --jq '.assets[] | select(.name == "app-update.json") | .url')
          gh api --header "Accept: application/octet-stream" "${ASSET_URL}" > store/app-update.json
          node -e "const j=require('./store/app-update.json');console.log('✓ 已包含更新目录 v'+j.version+'：'+Object.keys(j.platforms).join(', '))"

      - name: Upload store artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-store
          path: store/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库未启用 Pages 时由工作流自动启用（需 pages: write 权限，已声明）
          enablement: true

      - name: Stage Pages site
        run: |
          # 站点根下保留 store/ 子目录：应用内置源 URL 为 …/myToolbox/store/（与已发版宿主一致）
          mkdir -p site
          cp -R store site/store

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build-store
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  mirror-gitee:
    needs: build-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download store artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-store
          path: store

      - name: Push to Gitee mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }} # 例如 font-c/my-toolbox-store
        run: |
          set -e
          if [ -z "${GITEE_TOKEN:-}" ] || [ -z "${GITEE_REPO:-}" ]; then
            echo "跳过：未配置 GITEE_TOKEN / GITEE_REPO secrets（镜像源为可选）"
            exit 0
          fi
          git config --global user.name "store-bot"
          git config --global user.email "store-bot@users.noreply.github.com"
          # Gitee 令牌认证：用户名必须是 Gitee 用户名（owner），x-access-token 无效
          GITEE_OWNER="${GITEE_REPO%%/*}"
          git clone --depth 1 "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" gitee
          # 与 GitHub Pages 相同的布局：站点根下 store/ 子目录
          mkdir -p gitee/store
          rsync -a --delete store/ gitee/store/
          # 更新目录（specs/07）本地化：安装包 URL 改指 Gitee Release 附件
          # （与 release.yml 的 gitee-release 一致：附件发布在代码镜像仓库 my-toolbox）
          if [ -f gitee/store/app-update.json ]; then
            GITEE_OWNER="${GITEE_OWNER}" node -e '
              const fs = require("fs");
              const p = "gitee/store/app-update.json";
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              const to = "https://gitee.com/" + process.env.GITEE_OWNER + "/my-toolbox/releases/download/";
              for (const k of Object.keys(j.platforms || {})) {
                j.platforms[k].url = j.platforms[k].url.replace(
                  /^https:\/\/github\.com\/[^/]+\/[^/]+\/releases\/download\//, to);
              }
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
              console.log("✓ 更新目录 URL 已指向 Gitee 镜像");
            '
          fi
          # 镜像根说明与跳转页（store/ 之外不参与 --delete，保留人工改动）
          RAW_URL="https://gitee.com/${GITEE_REPO}/raw/master/store/"
          cat > gitee/README.md <<EOT
          # my-toolbox-store · 工具箱插件商店镜像源

          与主源（GitHub Pages）内容一致，由 CI（myToolbox 仓库 store.yml 的 mirror-gitee 任务）自动同步。
          应用内地址：${RAW_URL}（宿主商店页可一键切换）；契约见主仓库 specs/06-store-publish.md。
          EOT
          cat > gitee/index.html <<'EOT'
          <!DOCTYPE html>
          <html lang="zh-CN"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./store/index.json">
          <title>my-toolbox-store · 插件商店镜像</title></head>
          <body><p>商店索引：<a href="./store/index.json">store/index.json</a></p></body></html>
          EOT
          cd gitee
          git add -A
          git diff --cached --quiet && echo "镜像无变化" && exit 0
          git commit -m "store: sync from GitHub $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD
          # Gitee Pages 自动刷新（若仓库开启了 Gitee Pages API 服务）；失败不阻塞
          curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/pages/builds" \
            -d "access_token=${GITEE_TOKEN}" || true
