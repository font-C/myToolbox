name: build-tauri

# 仅保留手动构建（验证性打包）。版本发布统一走 release.yml（decide→build→release），
# 避免两套工作流在 v* tag 上竞态：tauri-action 产出草稿 Release、且与 release.yml
# 的 tag 重建互相踩踏，曾导致已发布的 Release 被打回草稿。
on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    permissions:
      contents: write # 创建/更新 GitHub Release（tauri-action 上传安装包）

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis # Windows 只用 NSIS，跳过 MSI/WiX 脆弱链路
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            bundles: app,dmg
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
          - os: ubuntu-latest
            bundles: deb,appimage
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: (Linux) Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            src-tauri/target
          key: ${{ matrix.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-tauri-

      - name: (Windows) Download pdfium.dll
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # pdfium-render 运行时需要外部 pdfium 动态库；从 bblanchon/pdfium-binaries
          # 最新 release 下载 win-x64 版本，解压并放到 src-tauri/（tauri 会打进资源目录）
          VERSION=$(curl -s https://api.github.com/repos/bblanchon/pdfium-binaries/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | sed 's/.*"\(.*\)"/\1/')
          echo "pdfium version: ${VERSION}"
          curl -sL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/${VERSION}/pdfium-win-x64.tgz"
          tar -xzf pdfium.tgz
          cp bin/pdfium.dll src-tauri/pdfium.dll
          ls -la src-tauri/pdfium.dll

      # 主程序自动更新（specs/07）：tauri.conf.json 已开启 createUpdaterArtifacts，
      # 构建即需 updater 签名私钥（与 release.yml 同一 secret）。
      # 构建签名只认 TAURI_SIGNING_PRIVATE_KEY（密钥内容，单行 base64）；
      # 空密码密钥也要显式置空密码变量，否则 CLI 会尝试交互式提示（CI 无 tty 直接失败）。
      - name: Resolve updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "✗ 缺少 secret TAURI_SIGNING_PRIVATE_KEY"
            echo "  生成：npm run tauri signer generate -- -w .secrets/updater-signing.key"
            echo "  配置见 specs/07-app-update.md「一次性配置」"
            exit 1
          fi
          # 剥离空白：secret 粘贴若带换行会破坏 GITHUB_ENV 的行格式
          KEY_B64="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Build & bundle ${{ matrix.os }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLES: ${{ matrix.bundles }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: '工具箱 v__VERSION__'
          releaseBody: |
            三平台打包产物（Windows .exe / macOS .dmg / Linux .deb、.AppImage）。
          releaseDraft: false
          prerelease: false